<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quinfall - Update Notes</title>
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Premium Background Effects -->
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
        <div class="noise-overlay"></div>
    </div>

    <!-- Top Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-q">Q</span>
                <div class="logo-text">
                    <h1>QUINFALL</h1>
                    <span class="subtitle" id="nav-subtitle">Update Notes</span>
                </div>
            </div>
            
            <div class="nav-links">
                <a href="index.html" class="nav-link active" id="nav-patch" data-tr="Yama Notları" data-en="Patch Notes">Patch Notes</a>
                <a href="fps.html" class="nav-link" id="nav-fps" data-tr="FPS Çözümleri" data-en="FPS Solutions">FPS Solutions</a>
                <a href="build.html" class="nav-link" id="nav-build" data-tr="Build Sistemi" data-en="Build System">Build System</a>
                <a href="info.html" class="nav-link" id="nav-info" data-tr="Bilinmesi Gerekenler" data-en="Things to Know">Things to Know</a>
            </div>

            <div class="lang-selector">
                <button class="lang-btn active" data-lang="tr">Türkçe</button>
                <button class="lang-btn" data-lang="en">English</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container multi-version-layout">
        <!-- Sidebar for Versions -->
        <aside class="version-sidebar">
            <h3 class="sidebar-title" id="sidebar-title">Update History</h3>
            <ul id="version-list" class="version-list">
                <!-- Dynamically populated -->
            </ul>
        </aside>

        <div class="patch-container">
            <!-- Header Section (Dynamic) -->
            <div class="patch-hero" id="patch-hero">
                <div class="version-badge" id="version-badge">v1.0.0.24</div>
                <h1 class="patch-title" id="patch-title">Loading...</h1>
                <p class="patch-date" id="patch-date">12 April 2026</p>
            </div>

            <!-- Content renders here -->
            <div id="content-body" class="content-body">
                <div class="loading-spinner"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Quinfall. <span id="footer-rights">All rights reserved.</span></p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
